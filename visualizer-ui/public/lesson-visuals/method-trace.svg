<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-labelledby="title desc">
  <title id="title">Java method call trace</title><desc id="desc">Main calls multiply with 5 and 10, creating a multiply stack frame that returns 50.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1687d9"/></marker></defs>
  <rect width="420" height="240" rx="18" fill="#f8fbfe"/>
  <text x="24" y="34" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">METHOD CALL TRACE</text>
  <text x="24" y="53" font-family="Arial,sans-serif" font-size="11" fill="#64748b">A method call adds a temporary frame, then returns a value.</text>
  <g transform="translate(30 78)"><rect width="155" height="116" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect width="155" height="30" rx="9" fill="#e2e8f0"/><text x="14" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a">main()</text><text x="15" y="55" font-family="monospace" font-size="11" fill="#475569">x = 5</text><text x="15" y="77" font-family="monospace" font-size="11" fill="#475569">y = 10</text><text x="15" y="99" font-family="monospace" font-size="11" fill="#0f766e">result = 50</text></g>
  <path d="M190 110H229" stroke="#1687d9" stroke-width="2.5" marker-end="url(#arrow)"/><text x="210" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#1687d9">call</text>
  <g transform="translate(236 78)"><rect width="154" height="116" rx="10" fill="#fff" stroke="#1687d9" stroke-width="2"/><rect width="154" height="30" rx="9" fill="#dbeafe"/><text x="14" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a">multiply()</text><text x="15" y="55" font-family="monospace" font-size="11" fill="#475569">a = 5</text><text x="15" y="77" font-family="monospace" font-size="11" fill="#475569">b = 10</text><text x="15" y="99" font-family="monospace" font-size="11" font-weight="700" fill="#0f766e">return 50</text></g>
  <path d="M236 174H198" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/><text x="216" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#0f766e">return</text>
</svg>
