<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-labelledby="title desc">
  <title id="title">Last in first out stack</title><desc id="desc">A new node containing 84 is pushed onto a stack above a node containing 42.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1687d9"/></marker></defs>
  <rect width="420" height="240" rx="18" fill="#f8fbfe"/>
  <text x="24" y="34" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">STACK: LAST IN, FIRST OUT</text>
  <text x="24" y="53" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Push adds a new item at the top.</text>
  <path d="M122 70V106" stroke="#1687d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="122" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1687d9">push 84</text>
  <path d="M58 86V209H210V86" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <rect x="72" y="112" width="124" height="40" rx="7" fill="#dbeafe" stroke="#1687d9" stroke-width="2"/><text x="134" y="137" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#0f172a">84  ← top</text>
  <rect x="72" y="159" width="124" height="40" rx="7" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="134" y="184" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#0f172a">42</text>
  <path d="M250 92H350" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="81" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#0f766e">first to pop</text>
  <rect x="270" y="107" width="100" height="48" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">newest item</text><text x="320" y="146" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" fill="#0f172a">84</text>
  <text x="300" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1687d9">84 → 42</text>
</svg>
