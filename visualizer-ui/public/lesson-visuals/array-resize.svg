<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-labelledby="title desc">
  <title id="title">Array storage and resizing</title><desc id="desc">Values from a three-slot array are copied into a new six-slot array.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1687d9"/></marker></defs>
  <rect width="420" height="240" rx="18" fill="#f8fbfe"/>
  <text x="24" y="34" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">ARRAY RESIZING</text>
  <text x="24" y="53" font-family="Arial,sans-serif" font-size="11" fill="#64748b">A fixed array grows by creating new storage and copying values.</text>
  <text x="25" y="91" font-family="monospace" font-size="11" font-weight="700" fill="#475569">old</text>
  <g transform="translate(62 70)"><rect width="150" height="44" rx="7" fill="#fff" stroke="#1687d9" stroke-width="2"/><path d="M50 0V44M100 0V44" stroke="#cbd5e1"/><text x="25" y="28" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#0f766e">5</text><text x="75" y="28" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#0f766e">10</text><text x="125" y="28" text-anchor="middle" font-family="monospace" font-size="15" fill="#94a3b8">0</text></g>
  <path d="M87 118C87 138 87 142 87 157M137 118C137 138 137 142 137 157" fill="none" stroke="#1687d9" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="25" y="187" font-family="monospace" font-size="11" font-weight="700" fill="#475569">new</text>
  <g transform="translate(62 158)"><rect width="300" height="44" rx="7" fill="#fff" stroke="#10b981" stroke-width="2"/><path d="M50 0V44M100 0V44M150 0V44M200 0V44M250 0V44" stroke="#cbd5e1"/><text x="25" y="28" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#0f766e">5</text><text x="75" y="28" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#0f766e">10</text><text x="125" y="28" text-anchor="middle" font-family="monospace" font-size="15" fill="#94a3b8">0</text><text x="175" y="28" text-anchor="middle" font-family="monospace" font-size="15" fill="#94a3b8">0</text><text x="225" y="28" text-anchor="middle" font-family="monospace" font-size="15" fill="#94a3b8">0</text><text x="275" y="28" text-anchor="middle" font-family="monospace" font-size="15" fill="#94a3b8">0</text></g>
  <text x="288" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1687d9">copy values</text>
</svg>
