<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-labelledby="title desc">
  <title id="title">Linked list insertion and linking</title>
  <desc id="desc">A head reference points to a node containing 10, which points to a node containing 20, which points to null.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1687d9"/></marker></defs>
  <rect width="420" height="240" rx="18" fill="#f8fbfe"/>
  <text x="24" y="34" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">LINKED LIST</text>
  <text x="24" y="53" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Each node stores a value and a link to the next node.</text>
  <rect x="24" y="95" width="62" height="42" rx="8" fill="#dbeafe" stroke="#1687d9" stroke-width="2"/>
  <text x="55" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">head</text>
  <text x="55" y="128" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a">ref</text>
  <path d="M86 116H124" stroke="#1687d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(132 82)"><rect width="104" height="70" rx="10" fill="#fff" stroke="#1687d9" stroke-width="2"/><path d="M68 0V70" stroke="#cbd5e1"/><text x="34" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">value</text><text x="34" y="50" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#0f766e">10</text><text x="86" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">next</text><circle cx="86" cy="48" r="5" fill="#1687d9"/></g>
  <path d="M218 130C248 130 244 116 270 116" fill="none" stroke="#1687d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(278 82)"><rect width="104" height="70" rx="10" fill="#fff" stroke="#10b981" stroke-width="2"/><path d="M68 0V70" stroke="#cbd5e1"/><text x="34" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">value</text><text x="34" y="50" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#0f766e">20</text><text x="86" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">next</text><text x="86" y="51" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">null</text></g>
  <text x="210" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1687d9">head → Node 10 → Node 20 → null</text>
</svg>
